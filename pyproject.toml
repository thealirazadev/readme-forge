[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-forge"
version = "0.1.0"
description = "Scans a repository and drafts a README.md using the Anthropic Claude API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thealirazadev" }]
keywords = ["readme", "cli", "claude", "documentation", "generator"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click==8.4.2",
    "rich==15.0.0",
    "anthropic==0.116.0",
    "pathspec==1.1.1",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "tomli==2.4.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "black==26.5.1",
    "build==1.5.1",
    "twine==6.2.0",
]

[project.urls]
Homepage = "https://github.com/thealirazadev/readme-forge"
Repository = "https://github.com/thealirazadev/readme-forge"

[project.scripts]
readme-forge = "readme_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "build", "dist"]
